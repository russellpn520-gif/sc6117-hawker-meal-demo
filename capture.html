<div class="capture">
  <button type="button" class="take">拍下这餐</button>
  <button type="button" class="album">从相册选</button>
  <input type="file" accept="image/*" capture="environment" class="camera-file" hidden>
  <input type="file" accept="image/*" class="album-file" hidden>
  <details class="scale-hint"><summary>补充份量线索（选填）</summary>
    <label><span>份量线索</span><input class="scale-input" type="text" maxlength="150" autocomplete="off"></label>
  </details>
  <p role="status" aria-live="polite"></p>
</div>
<style>
  .capture {display:grid;grid-template-columns:1.6fr 1fr;gap:.55rem;font-family:inherit}
  .capture button {min-height:50px;font:650 1rem/1.25 system-ui,sans-serif;border:1px solid #D7D5CC;
    border-radius:.8rem;cursor:pointer;padding:.6rem .65rem}
  .take {font-size:1.18rem;font-weight:700;color:#fff;background:#D96B38;border-color:#D96B38}
  .take:hover {background:#C45B2A;border-color:#C45B2A}
  .album {color:#1B201E;background:#F3F2EE}
  .capture button:focus-visible {outline:3px solid #bc8b35;outline-offset:2px}
  .capture button:disabled {opacity:.55}
  .capture p {grid-column:1/-1;font:400 .9rem/1.35 system-ui,sans-serif;margin:0}
  .capture p:empty {display:none}
  .scale-hint {grid-column:1/-1;font:.9rem system-ui,sans-serif}
  .scale-hint summary {display:flex;align-items:center;gap:.4rem;min-height:40px;width:fit-content;
    cursor:pointer;list-style:none;font-weight:500}
  .scale-hint summary::-webkit-details-marker {display:none}
  .scale-hint summary::after {content:"";display:inline-block;width:.42rem;height:.42rem;
    border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px)}
  .scale-hint[open] summary::after {transform:rotate(225deg)}
  .scale-hint label {display:grid;gap:.3rem;margin-top:.25rem}
  .scale-input {box-sizing:border-box;width:100%;border:1px solid #86968c;border-radius:.5rem;padding:.55rem;font:1rem system-ui,sans-serif}
</style>
